<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="RegiMenu — chat-first nutrition coach.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="RegiMenu">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Mobile App</title>
  <link rel="manifest" href="manifest.json">

  <!-- Barcode scanning polyfill for WebKit (iOS Safari + every iOS browser,
       which have no native BarcodeDetector). Backed by ZXing-C++ WebAssembly.
       SELF-HOSTED on purpose (no CDN): this is an installed PWA used at the
       grocery shelf, so scanning must survive flaky store Wi-Fi / offline, and
       we don't want a third-party runtime dependency. The polyfill installs
       window.BarcodeDetector ONLY if one isn't already present, so Android
       Chrome's native detector is left completely untouched.

       Blocking classic script (same pattern as the Auth0 SDK below) so the
       global exists before Flutter boots — no readiness race in Dart. The
       .wasm is fetched lazily on first detect(), so the locateFile override
       just below (pointing at the self-hosted copy, matching zxing-wasm@3.1.3)
       is set well before any scan. -->
  <script src="vendor/barcode-detector/polyfill.min.js"></script>
  <script>
    // Serve the ZXing reader .wasm from our own origin instead of jsDelivr.
    // The module asks for "zxing_reader.wasm"; hand back the vendored path.
    if (window.BarcodeDetectionAPI && window.BarcodeDetectionAPI.prepareZXingModule) {
      window.BarcodeDetectionAPI.prepareZXingModule({
        overrides: {
          locateFile: function (path, prefix) {
            if (path.endsWith('.wasm')) {
              return 'vendor/barcode-detector/' + path;
            }
            return prefix + path;
          },
        },
      });
    }
  </script>

  <!-- Required by auth0_flutter on web: loads the Auth0 SPA JS SDK that the
       Dart plugin delegates to. Without this, Auth0Client is undefined. -->
  <script src="https://cdn.auth0.com/js/auth0-spa-js/2.1/auth0-spa-js.production.js"></script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
